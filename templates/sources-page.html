<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Источники — Белозерье</title>
  <link rel="preload" as="image" href="../images/textures/homepage-parchment-v3.webp" fetchpriority="high">
  <style>
    :root { color-scheme: light; --ink: #33281f; --deep: #241f1a; --muted: #80664f; --accent: #9a3412; --rule: rgba(111,78,43,.25); --page-max-width: 1510px; --page-inline-padding: clamp(20px,3.3vw,52px); }
    * { box-sizing: border-box; }
    body {
      margin: 0; color: var(--ink); font: 16px/1.5 Georgia, "Times New Roman", serif;
      background: linear-gradient(110deg,rgba(255,250,231,.54),rgba(232,216,181,.26)), url("../images/textures/homepage-parchment-v3.webp") center/cover fixed #e8dfc4;
    }
    a { color: inherit; text-decoration: none; }
    a:hover, a:focus-visible { text-decoration: underline; text-underline-offset: 4px; }
    .site-header {
      position: sticky; top: 0; z-index: 1000; display: flex; align-items: center; justify-content: space-between; gap: 20px;
      min-height: 62px; padding-inline: max(var(--page-inline-padding),calc((100vw - var(--page-max-width))/2 + var(--page-inline-padding)));
      color: #f8f4e9; background: #181818; border-bottom: 1px solid rgba(255,255,255,.12);
    }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-size: 1.15rem; font-weight: 700; }
    .brand img { width: 36px; height: 36px; }
    .site-nav { font: 650 .85rem/1.4 system-ui,sans-serif; }
    main { width: min(1050px,100%); margin: auto; padding: 30px var(--page-inline-padding) 48px; }
    .back-link { color: var(--accent); font: 650 .8rem/1.5 system-ui,sans-serif; }
    h1 { margin: 16px 0 24px; color: var(--deep); font-size: clamp(2rem,4vw,3rem); line-height: 1.15; }
    .sources-list { padding: 8px 26px; border: 1px solid var(--rule); border-radius: 5px; background: rgba(255,251,235,.57); }
    .book-item { display: grid; grid-template-columns: 84px minmax(0,1fr); gap: 20px; align-items: start; padding: 24px 0; border-top: 1px solid var(--rule); }
    .book-item:first-child { border-top: 0; }
    .book-year { padding: 6px 5px; border-radius: 3px; color: #fff; background: #876b50; font: 700 .8rem/1.35 system-ui,sans-serif; text-align: center; }
    .book-title { color: var(--accent); font-size: 1.15rem; font-weight: 700; line-height: 1.35; }
    .book-description { margin-top: 7px; color: var(--muted); font: .88rem/1.6 system-ui,sans-serif; overflow-wrap: anywhere; }
    @media (max-width: 520px) {
      .site-header { padding-inline: 14px; }
      main { padding: 24px 14px 38px; }
      .sources-list { padding: 4px 17px; }
      .book-item { grid-template-columns: minmax(0,1fr); gap: 12px; }
      .book-year { justify-self: start; min-width: 78px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../" aria-label="Белозерье — главная"><img src="../images/icons/belozerye-monastery-logo.svg" alt=""><span>Белозерье</span></a>
    <nav class="site-nav" aria-label="Основная навигация"><a href="../map/">Карта</a></nav>
  </header>
  <main>
    <a class="back-link" href="../">← На главную</a>
    <h1>Источники</h1>
    <section class="sources-list" aria-label="Книги проекта">
{{BOOK_ITEMS}}
    </section>
  </main>
</body>
</html>
