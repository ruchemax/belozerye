<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Страница не найдена — Белозерье</title>
  <link rel="icon" href="/images/icons/belozerye-monastery-logo.svg" type="image/svg+xml">
  <style>
    :root { color-scheme:light; --ink:#2f261f; --accent:#9a3412; --paper:#eee6c9; }
    * { box-sizing:border-box; }
    body { display:grid; min-height:100vh; margin:0; place-items:center; color:var(--ink); background:var(--paper) url("/images/textures/homepage-parchment-v3.webp") center/cover fixed; font:18px/1.55 Georgia,"Times New Roman",serif; }
    main { width:min(680px,calc(100% - 32px)); padding:clamp(28px,6vw,60px); text-align:center; border:1px solid rgba(111,78,43,.25); border-radius:8px; background:rgba(255,252,235,.72); box-shadow:0 8px 30px rgba(58,41,24,.1); }
    body { grid-template-rows: 62px 1fr; }
    img { width:64px; height:64px; }
    h1 { margin:.7rem 0 .4rem; font-size:clamp(2rem,7vw,3.6rem); line-height:1.05; }
    p { margin:.4rem 0 1.4rem; }
    a { display:inline-block; padding:.65rem 1rem; border-radius:4px; color:#fffaf0; background:var(--accent); font:700 .88rem system-ui,sans-serif; text-decoration:none; }
    a:hover, a:focus-visible { background:#7c2d12; }
  </style>
<style id="global-site-header-styles">.global-site-header {
  position: sticky;
  top: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  gap: 16px;
  box-sizing: border-box;
  width: 100%;
  height: 62px;
  padding: 0 clamp(14px, 3.3vw, 52px);
  border-bottom: 1px solid rgba(255,255,255,.12);
  color: #f8f4e9;
  background: #181818;
}
.global-site-header a {
  padding: 0;
  border: 0;
  border-radius: 0;
  color: inherit;
  background: none;
  text-decoration: none;
}
.global-site-header .global-brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font: 700 1.15rem/1.4 Georgia, "Times New Roman", serif;
}
.global-site-header .global-brand img { width: 36px; height: 36px; }
.global-site-header .global-site-nav { display: flex; align-items: center; gap: 24px; }
.global-site-header .global-site-nav a { font: 650 .85rem/1.4 system-ui, sans-serif; }
.global-site-header a:hover,
.global-site-header a:focus-visible,
.global-site-header a[aria-current="page"] { text-decoration: underline; text-underline-offset: 4px; }
@media (max-width: 520px) {
  .global-site-header { padding-inline: 14px; gap: 12px; }
  .global-site-header .global-site-nav { gap: 14px; }
}
</style>
</head>
<body>
<header class="global-site-header">
  <a class="global-brand" href="/" aria-label="Белозерье — главная">
    <img src="/images/icons/belozerye-monastery-logo.svg" alt="">
    <span>Белозерье</span>
  </a>
  <nav class="global-site-nav" aria-label="Основная навигация">
    <a href="/sources/">Источники</a>
    <a href="/map/">Карта</a>
  </nav>
</header>
  <main>
    <img src="/images/icons/belozerye-monastery-logo.svg" alt="">
    <h1>Страница не найдена</h1>
    <p>Возможно, адрес был введён с ошибкой или страница была перемещена.</p>
    <a href="/">Вернуться на главную</a>
  </main>
</body>
</html>
