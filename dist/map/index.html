  <style>
    :root { color-scheme: light; --paper:#eee6c9; --ink:#33281f; --accent:#9a3412; --line:rgba(111,78,43,.25); --muted:#80664f; }
    * { box-sizing:border-box; }
    .visually-hidden { position:absolute!important; width:1px!important; height:1px!important; padding:0!important; margin:-1px!important; overflow:hidden!important; clip:rect(0,0,0,0)!important; white-space:nowrap!important; border:0!important; }
    body { margin:0; min-height:100vh; color:var(--ink); background:#e9dfc4 url("../images/textures/homepage-parchment-v3.webp") center/cover fixed; font:Georgia,"Times New Roman",serif; }
    .site-header { position:sticky; top:0; z-index:1000; display:flex; align-items:center; justify-content:space-between; min-height:62px; padding:0 14px; color:#f8f4e9; background:#181818; border-bottom:1px solid rgba(255,255,255,.12); }
    .brand { display:inline-flex; align-items:center; gap:10px; color:inherit; text-decoration:none; font-size:1.15rem; font-weight:700; }
    .brand img { width:36px; height:36px; }
    .shell { width:100%; max-width:none; height:calc(100vh - 62px); margin:0; padding:10px; }
    h1 { margin:0; font-size:clamp(1.8rem,3vw,2.6rem); }
    .layout { display:grid; grid-template-columns:minmax(245px,310px) minmax(0,1fr) minmax(190px,260px); gap:18px; height:100%; min-height:0; }
    .filters,.selected-panel,.map-panel { border:1px solid var(--line); border-radius:6px; background:rgba(255,252,235,.68); box-shadow:0 2px 9px rgba(58,41,24,.08); }
    .filters { display:flex; flex-direction:column; padding:10px; overflow-y:auto; }
    h2 { margin:0; font-size:1.25rem; }
    .filters p { margin:5px 0 10px; color:var(--muted); font:500 .8rem/1.45 system-ui,sans-serif; }
    label { display:grid; gap:3px; margin:0 0 8px; color:#6a5645; font:700 .64rem/1.2 system-ui,sans-serif; letter-spacing:.05em; text-transform:uppercase; }
    select { width:100%; min-height:32px; padding:4px 7px; border:1px solid #cdbd99; border-radius:3px; color:var(--ink); background:#fffaf0; font:.78rem system-ui,sans-serif; }
    button { border:1px solid #8d7352; border-radius:3px; padding:7px 9px; color:#fffaf0; background:var(--accent); font:700 .75rem system-ui,sans-serif; cursor:pointer; }
    #filter-tab { display:flex; flex:1; min-height:0; flex-direction:column; }
    #filter-tab[hidden], #legend-tab[hidden] { display:none; }
    .current-group-heading { display:flex; align-items:center; gap:7px; margin:0 0 7px; color:var(--ink); font:700 .75rem/1.2 system-ui,sans-serif; }
    .current-group-heading i { display:inline-block; width:11px; height:11px; border:1px solid rgba(0,0,0,.3); border-radius:50%; }
    .group-list { display:grid; gap:6px; margin:auto 0 0; }
    .group-choice { border:1px solid var(--line); border-radius:3px; background:rgba(255,250,240,.72); font:.75rem system-ui,sans-serif; }
    .group-choice summary { display:flex; align-items:center; gap:7px; padding:7px; cursor:pointer; font-weight:700; }
    .group-choice i { display:inline-block; width:11px; height:11px; border:1px solid rgba(0,0,0,.3); border-radius:50%; }
    .group-choice > div:last-child { display:flex; justify-content:flex-end; padding:0 7px 7px; }
    .group-choice button { padding:2px 6px; font-size:.68rem; }
    #add-group { width:100%; margin:0 0 7px; background:#6d4c35; }
    #delete-current-group { width:100%; margin:0 0 7px; background:#8a2f1b; }
    .selected-panel { display:flex; flex-direction:column; min-height:0; padding:10px; }
    .selected-panel-header { display:flex; align-items:center; justify-content:space-between; gap:8px; padding-bottom:8px; border-bottom:1px solid var(--line); }
    .selected-object-tabs { display:flex; gap:3px; }
    .selected-object-tabs button { padding:4px 5px; border:0; border-bottom:2px solid transparent; border-radius:2px 2px 0 0; color:var(--muted); background:transparent; font-size:.68rem; }
    .selected-object-tabs button[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--accent); }
    #selected-objects-count { color:var(--muted); font:600 .7rem system-ui,sans-serif; }
    .selected-objects { display:grid; gap:2px; margin:8px -3px 0 0; padding:0 4px 0 0; overflow-y:auto; list-style:none; scrollbar-width:thin; }
    .selected-objects li { min-width:0; }
    .selected-object-link { display:flex; align-items:center; gap:6px; padding:4px 3px; color:var(--ink); font:.75rem/1.25 system-ui,sans-serif; text-decoration:none; }
    .selected-object-link:hover, .selected-object-link:focus-visible { color:var(--accent); text-decoration:underline; }
    .selected-object-marker { flex:0 0 auto; width:8px; height:8px; border:1px solid rgba(0,0,0,.3); border-radius:50%; }
    .selected-object-church-icon { flex:0 0 auto; width:15px; height:15px; object-fit:contain; }
    .selected-object-overlap-marker { flex:0 0 auto; width:15px; height:15px; }
    .selected-objects-empty { margin:10px 0; color:var(--muted); font:.75rem/1.35 system-ui,sans-serif; }
    .map-panel { position:relative; display:flex; flex-direction:column; overflow:hidden; }
    .map-head { display:flex; justify-content:space-between; gap:14px; align-items:baseline; padding:15px 17px 11px; }
    .map-head p { margin:3px 0 0; color:var(--muted); font:.78rem system-ui,sans-serif; }
    #filter-map { flex:1; min-height:0; background:#e5e7dc; }
    .map-marker-popup { position:relative; min-width:185px; max-width:260px; padding:9px 10px; border:1px solid #8d7352; border-radius:5px; background:#fffaf0; box-shadow:0 3px 12px #0003; font: .78rem/1.35 system-ui,sans-serif; }
    .map-marker-popup strong { display:block; margin:0 20px 7px 0; color:var(--ink); }
    .map-marker-popup a { display:block; padding:4px 0; color:var(--accent); text-decoration:underline; text-underline-offset:2px; }
    .map-marker-popup-close { position:absolute; top:4px; right:5px; padding:1px 5px; color:var(--ink); background:transparent; border:0; font-size:1rem; }
    .panel-tabs { display:flex; gap:3px; margin-bottom:8px; border-bottom:1px solid var(--line); }
    .panel-tabs button { margin:0; padding:5px 7px; border:0; border-bottom:2px solid transparent; border-radius:3px 3px 0 0; color:var(--muted); background:transparent; }
    .panel-tabs button[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--accent); }
    #map-legend { font:.75rem/1.35 system-ui,sans-serif; }
    #legend-tab { max-height:calc(100vh - 180px); overflow-y:auto; padding-right:5px; scrollbar-width:thin; }
    #map-legend[hidden] { display:none; }
    .legend-group + .legend-group { margin-top:8px; padding-top:8px; border-top:1px solid var(--line); }
    .legend-title { display:flex; align-items:center; gap:6px; font-weight:700; }
    .legend-title i { width:11px; height:11px; border:1px solid rgba(0,0,0,.3); border-radius:50%; }
    .legend-group dl { display:grid; grid-template-columns:auto 1fr; gap:2px 6px; margin:5px 0 0; }
    .legend-group dt { color:var(--muted); }
    .legend-group dd { margin:0; overflow-wrap:anywhere; }
    .map-hover-label { display:inline-block; color:transparent; font:var(--map-marker-label-font); white-space:nowrap; text-decoration:none; text-shadow:none; border-bottom:1px solid var(--map-place-label-color); pointer-events:none; }
    .map-hover-label.is-church { border-bottom-color:var(--map-church-label-color); }
    .ol-attribution { font-size:10px; }
    @media (max-width:800px) { .site-header { padding-inline:18px; } .shell { height:auto; padding:15px; } .layout { grid-template-columns:1fr; } .selected-panel { min-height:220px; } #filter-map { min-height:500px; } }

      const groupList = document.querySelector("#group-list");
      const currentFilterControls = document.querySelector("#current-filter-controls");
      const filterControlsAnchor = document.querySelector("#filter-controls-anchor");
      const currentGroupHeading = document.querySelector("#current-group-heading");
      const selectedObjects = document.querySelector("#selected-objects");
      const selectedObjectsCount = document.querySelector("#selected-objects-count");
      const selectedPlacesTab = document.querySelector("#selected-places-tab");
      const selectedChurchesTab = document.querySelector("#selected-churches-tab");

      let selectedVisibleObjects = [];

      const filterTab = document.querySelector("#filter-tab");
      const legendTab = document.querySelector("#legend-tab");
      const filtersTabButton = document.querySelector("#filters-tab");
      const legendTabButton = document.querySelector("#legend-tab-button");
      const groupColors = ["#dc2626", "#008000", "#2563eb", "#7e22ce", "#c2410c"];
      const originalChurchIconColor = "#2563eb";
      const churchIconSources = new Map([[originalChurchIconColor, "../images/icons/church-marker.png"]]);
      const savedGroups = [];
      let currentGroupActive = true;
      let editingGroupIndex = null;

        const option = document.createElement("option"); option.value = value; option.textContent = label; select.append(option);
      });
      addOptions(selects.books, bookOptions);
      const selectedBook = () => selects.books.value;
      const resetOptions = (select, label) => { select.innerHTML = ""; const option=document.createElement("option"); option.value=""; option.textContent=label; select.append(option); };
      const currentGroup = () => ({
        id: "current",
        color: groupColor.value,
        objectKind: objectKind.value,
        books: selectedBook(),
        land: selects.land.value,
        owners: selects.owners.value,
        uezd: administrativeUezd.value,
        stan: administrativeStan.value,
        prikaz: administrativePrikaz.value,
        volost: administrativeVolost.value,
        child: administrativeChild.value,

          if (!marker || !pixel) continue;
          const kind = marker.get("kind");
          const isGroupOverlap = (marker.get("groupColors") ?? []).length > 1;
          const count = members.length;
          const iconWidth = isGroupOverlap ? 16 : kind === "church" ? settings.church.iconWidth : settings.place.diameter;
          const iconHeight = isGroupOverlap ? 16 : kind === "church" ? settings.church.iconHeight : settings.place.diameter;
          if (count > 1) {
            const radius = Math.min(19, 11 + Math.ceil(Math.log2(count)));
            objectBounds.push({left:pixel[0]-radius,right:pixel[0]+radius,top:pixel[1]-radius,bottom:pixel[1]+radius});
            continue;
          }
          const iconBounds = {left:pixel[0]-iconWidth/2,right:pixel[0]+iconWidth/2,top:kind === "church" && !isGroupOverlap ? pixel[1]-iconHeight : pixel[1]-iconHeight/2,bottom:kind === "church" && !isGroupOverlap ? pixel[1] : pixel[1]+iconHeight/2};
          const offsetX = isGroupOverlap ? overlapLabelOffsetX : kind === "church" ? settings.church.labelOffsetX : settings.place.labelOffsetX;
          const offsetY = kind === "church" && !isGroupOverlap ? settings.church.labelOffsetY : 0;
          const width = textMeasure.measureText(marker.get("name")).width + 4;
          const left = kind === "church" && !isGroupOverlap ? pixel[0] + offsetX - width : pixel[0] + offsetX;
          labels.push({feature,iconBounds,labelBounds:{left,right:left+width,top:pixel[1]+offsetY-8,bottom:pixel[1]+offsetY+8}});
          objectBounds.push(iconBounds);
        }
        const occupiedLabelBounds = [];
        for (const item of labels) {
          const hiddenByObject = objectBounds.some((bounds) => bounds !== item.iconBounds && settings.clusters.overlaps(item.labelBounds, bounds));
          const hiddenByLabel = occupiedLabelBounds.some((bounds) => settings.clusters.overlaps(item.labelBounds, bounds));
          const showLabel = !hiddenByObject && !hiddenByLabel;
          item.feature.set("showLabel", showLabel, true);
          if (showLabel) occupiedLabelBounds.push(item.labelBounds);
        }
      };
      const rebuildClusters = () => {
        const rebuild = (kind, target) => {
          const entries = source.getFeatures().filter((feature) => feature.get("kind") === kind).map((member) => {
            const coordinate = member.getGeometry().getCoordinates(); const pixel = map.getPixelFromCoordinate(coordinate);
            const isGroupOverlap = (member.get("groupColors") ?? []).length > 1;
            const width = isGroupOverlap ? 16 : kind === "church" ? settings.church.iconWidth : settings.place.diameter;
            const height = isGroupOverlap ? 16 : kind === "church" ? settings.church.iconHeight : settings.place.diameter;
            return { kind, member, iconBounds:{left:pixel[0]-width/2,right:pixel[0]+width/2,top:kind === "church" && !isGroupOverlap ? pixel[1]-height : pixel[1]-height/2,bottom:kind === "church" && !isGroupOverlap ? pixel[1] : pixel[1]+height/2} };
          });
          target.clear();
          const entriesByGroup = new Map();
          entries.forEach((entry) => { const group = entry.member.get("groupId") ?? "default"; entriesByGroup.set(group, [...(entriesByGroup.get(group) ?? []), entry]); });
          target.addFeatures([...entriesByGroup.values()].flatMap((groupEntries) => settings.clusters.group(groupEntries).map((group) => {
            const members = group.map((entry) => entry.member);
            const center = members.reduce((sum,member) => { const [x,y]=member.getGeometry().getCoordinates(); return [sum[0]+x/members.length,sum[1]+y/members.length]; },[0,0]);
            return new ol.Feature({geometry:new ol.geom.Point(center),features:members});
          })));
        };
        rebuild("place",placeSource); rebuild("church",churchSource);
        refreshLabelVisibility();
        styleCache.clear();
      };
      let rebuildTimer = null;
      const scheduleRebuild = () => {
        clearTimeout(rebuildTimer);
        rebuildTimer = setTimeout(() => {
          rebuildTimer = null;
          rebuildClusters();
        }, 120);
      };
      map.getView().on("change:resolution", () => {
        styleCache.clear();
        placesLayer.changed(); churchesLayer.changed(); placeClusterLayer.changed(); churchClusterLayer.changed();
        scheduleRebuild();
      });
      map.on("moveend", scheduleRebuild);
      let resizeFrame = null;
      new ResizeObserver(() => {
        cancelAnimationFrame(resizeFrame);
        resizeFrame = requestAnimationFrame(() => {
          map.updateSize();
          scheduleRebuild();
        });
      }).observe(document.querySelector("#filter-map"));
      let filterFitTimer = null;
      const fitToVisibleFeatures = (featureCount) => {
        if (!featureCount) return;
        map.updateSize();
        const size = map.getSize();
        if (!size || !size[0] || !size[1]) return;
        map.getView().fit(source.getExtent(), {
          size,
          padding: [55, 55, 55, 55],
          maxZoom: featureCount === 1 ? 13 : 14,
          duration: 0
        });
      };
      const renderSelectedObjects = (visible) => {
        selectedVisibleObjects = visible;
        const uniqueObjects = new Map();
        visible.filter((item) => item.kind === selectedObjectKind).forEach((item) => {
          const key = `${item.kind}:${item.id}`;
          const previous = uniqueObjects.get(key);
          if (!previous) {
            uniqueObjects.set(key, { ...item, groupColors:[item.groupColor] });
            return;
          }
          const groupColors = [...previous.groupColors, item.groupColor].filter((color, index, colors) => colors.indexOf(color) === index);
          uniqueObjects.set(key, { ...item, groupColors });
        });
        const selected = [...uniqueObjects.values()].sort((left, right) => left.name.localeCompare(right.name, "ru-RU"));
        selectedObjectsCount.textContent = String(selected.length);
        selectedObjects.replaceChildren();
        if (!selected.length) {
          const empty = document.createElement("li");
          empty.className = "selected-objects-empty";
          empty.textContent = "Нет выбранных объектов";
          selectedObjects.append(empty);
          return;
        }
        selected.forEach((item) => {
          const entry = document.createElement("li");
          const link = document.createElement("a");
          link.className = "selected-object-link";
          link.href = item.kind === "church" ? `../churches/${encodeURIComponent(item.slug)}/` : `../places/${encodeURIComponent(item.slug)}/`;
          const marker = item.groupColors.length > 1 || item.kind === "church" ? document.createElement("img") : document.createElement("i");
          if (item.groupColors.length > 1) {
            marker.className = "selected-object-overlap-marker";
            marker.src = overlapMarkerSource(item.groupColors);
            marker.alt = "";
          } else if (item.kind === "church") {
            marker.className = "selected-object-church-icon";
            marker.src = churchIconSources.get(item.groupColor) ?? "../images/icons/church-marker.png";
            marker.alt = "";
          } else {
            marker.className = "selected-object-marker";
            marker.style.background = item.groupColor;
          }
          const name = document.createElement("span");
          name.textContent = item.name;
          link.append(marker, name);
          entry.append(link);
          selectedObjects.append(entry);
        });
      };
      const showSelectedObjectKind = (kind) => {
        selectedObjectKind = kind;
        selectedPlacesTab.setAttribute("aria-selected", String(kind === "place"));
        selectedChurchesTab.setAttribute("aria-selected", String(kind === "church"));
        renderSelectedObjects(selectedVisibleObjects);
      };
      const update = (fitMap = true) => {
        const values = Object.fromEntries(fields.map((field) => [field, selects[field].value]));
        const hasAdministrativeFilter = administrativeUezd.value || administrativeStan.value || administrativePrikaz.value || administrativeVolost.value || administrativeChild.value || administrativeSelo.value;
        const currentVisible = items.filter((item) => (!objectKind.value || item.kind === objectKind.value) && fields.every((field) => {
          if (!values[field]) return true;
          if (field === "land") return item.land_by_book?.[values.books]?.includes(values[field]);
          if (field === "owners") return values.land ? item.owners_by_land_by_book?.[values.books]?.[values.land]?.includes(values[field]) : item.owners_by_book?.[values.books]?.includes(values[field]);
          return item[field].includes(values[field]);
        }) && (!hasAdministrativeFilter || item.administrative_records?.some((record) => (!values.books || values.books === record.book) && (!administrativeUezd.value || record.uezd === administrativeUezd.value) && (!administrativeStan.value || record.stan === administrativeStan.value) && (!administrativePrikaz.value || record.prikaz === administrativePrikaz.value) && (!administrativeVolost.value || record.volost === administrativeVolost.value) && (!administrativeChild.value || record.child === administrativeChild.value) && (!administrativeSelo.value || record.selo === administrativeSelo.value))));
        const editedGroup = currentGroup();
        const groups = savedGroups.map((group, index) => index === editingGroupIndex ? { ...editedGroup, id:group.id } : group);
        if (editingGroupIndex === null && currentGroupActive) groups.push(editedGroup);
        renderLegend(groups);
        const visible = groups.flatMap((group, groupOrder) => (group.id === "current" ? currentVisible : items.filter((item) => groupMatches(item, group))).map((item) => ({ ...item, groupColor:group.color, groupId:group.id, groupOrder })));
        renderSelectedObjects(visible);
        const mapMarkers = new Map();
        visible.forEach((item) => {
          const key = `${item.kind}:${item.id}`;
          const previous = mapMarkers.get(key);
          if (!previous) {
            mapMarkers.set(key, { ...item, groupColors:[item.groupColor] });
            return;
          }
          const groupColors = [...previous.groupColors, item.groupColor].filter((color, index, colors) => colors.indexOf(color) === index);
          mapMarkers.set(key, { ...item, groupColors });
        });
        source.clear();
        source.addFeatures([...mapMarkers.values()].map((item) => new ol.Feature({ geometry:new ol.geom.Point(ol.proj.fromLonLat([item.longitude,item.latitude])), ...item })));
        rebuildClusters();
        clearTimeout(filterFitTimer);
        if (fitMap && visible.length) {
          filterFitTimer = setTimeout(() => {
            map.once("moveend", () => {
              rebuildClusters();
              placesLayer.changed(); churchesLayer.changed(); placeClusterLayer.changed(); churchClusterLayer.changed();
            });
            fitToVisibleFeatures(visible.length);
          }, 120);
        }
      };
      const activateCurrentGroup = () => { currentGroupActive = true; };
      objectKind.addEventListener("change", () => { activateCurrentGroup(); update(); });
      fields.forEach((field) => selects[field].addEventListener("change", () => {
        activateCurrentGroup();
        if (field === "books") {
          if (!selects.books.value) { selects.land.value=""; selects.owners.value=""; }
          updateAdministrativeOptions();
        }
        if (field === "land") updateSourceValueOptions(selects.books.value);
        update();
      }));
      administrativeUezd.addEventListener("change", () => { activateCurrentGroup(); updateAdministrativeOptions(); update(); });
      administrativeStan.addEventListener("change", () => { activateCurrentGroup(); updateAdministrativeOptions(); update(); });
      administrativePrikaz.addEventListener("change", () => { activateCurrentGroup(); updateAdministrativeOptions(); update(); });
      administrativeVolost.addEventListener("change", () => { activateCurrentGroup(); updateAdministrativeOptions(); update(); });
      administrativeChild.addEventListener("change", () => { activateCurrentGroup(); updateAdministrativeOptions(); update(); });
      administrativeSelo.addEventListener("change", () => { activateCurrentGroup(); updateSourceValueOptions(selectedBook()); update(); });
      groupColor.addEventListener("change", () => { activateCurrentGroup(); update(); });
      document.querySelector("#add-group").addEventListener("click", () => {
        const group = currentGroup();
        if (editingGroupIndex !== null) { group.id = savedGroups[editingGroupIndex].id; savedGroups[editingGroupIndex] = group; editingGroupIndex = null; }
        else { if (savedGroups.length >= 4) return; group.id = `saved-${Date.now()}`; savedGroups.push(group); }
        objectKind.value=""; fields.forEach((field) => { selects[field].value=""; }); administrativeUezd.value=""; administrativeStan.value=""; administrativePrikaz.value=""; administrativeVolost.value=""; administrativeChild.value=""; administrativeSelo.value="";
        groupColor.value = groupColors.find((color) => !savedGroups.some((saved) => saved.color === color)) ?? groupColors[0];
        currentGroupActive = true; document.querySelector("#add-group").textContent = "Добавить группу"; updateAdministrativeOptions(); renderGroups(); update();
      });
      document.querySelector("#delete-current-group").addEventListener("click", () => {
        if (editingGroupIndex === null) {
          const previousIndex = savedGroups.length - 1;
          if (previousIndex < 0) return;
          const previous = savedGroups[previousIndex];
          editingGroupIndex = previousIndex;
          objectKind.value = previous.objectKind; selects.books.value = previous.books; groupColor.value = previous.color;
          updateAdministrativeOptions();
          restoreAdministrativeFilters(previous);
          updateAdministrativeOptions(); selects.land.value = previous.land; updateSourceValueOptions(previous.books); selects.owners.value = previous.owners;
          currentGroupActive = true;
          filterControlsAnchor.after(currentFilterControls);
          renderGroups();
          update();
          return;
        }
        const removedIndex = editingGroupIndex;
        savedGroups.splice(removedIndex, 1);
        editingGroupIndex = null;
        const nextIndex = Math.min(removedIndex, savedGroups.length - 1);
        if (nextIndex >= 0) {
          const next = savedGroups[nextIndex];
          editingGroupIndex = nextIndex;
          objectKind.value = next.objectKind; selects.books.value = next.books; groupColor.value = next.color;
          updateAdministrativeOptions();
          restoreAdministrativeFilters(next);
          updateAdministrativeOptions(); selects.land.value = next.land; updateSourceValueOptions(next.books); selects.owners.value = next.owners;
        } else {
          objectKind.value=""; fields.forEach((field) => { selects[field].value=""; }); administrativeUezd.value=""; administrativeStan.value=""; administrativePrikaz.value=""; administrativeVolost.value=""; administrativeChild.value=""; administrativeSelo.value="";
          groupColor.value = groupColors[0]; updateAdministrativeOptions();
        }
        currentGroupActive = true;
        filterControlsAnchor.after(currentFilterControls);
        renderGroups();
        update();
      });
      document.querySelector("#reset-filters").addEventListener("click", () => { savedGroups.length=0; editingGroupIndex=null; objectKind.value=""; fields.forEach((field) => { selects[field].value=""; }); administrativeUezd.value=""; administrativeStan.value=""; administrativePrikaz.value=""; administrativeVolost.value=""; administrativeChild.value=""; administrativeSelo.value=""; groupColor.value=groupColors[0]; currentGroupActive=true; document.querySelector("#add-group").textContent="Добавить группу"; updateAdministrativeOptions(); renderGroups(); update(); });
      map.on("pointermove", (event) => {
        const feature = map.forEachFeatureAtPixel(event.pixel, (candidate) => candidate, { hitTolerance:6 });
        const members = feature?.get("features") ?? [];
        const canUnderline = settings.labels.underlineOnHover && members.length === 1 && feature?.get("showLabel") !== false;
        const nextHoveredFeature = canUnderline ? feature : null;
        if (hoveredFeature !== nextHoveredFeature) {
          hoveredFeature = nextHoveredFeature;
          styleCache.clear();
          placesLayer.changed(); churchesLayer.changed(); placeClusterLayer.changed(); churchClusterLayer.changed();
        }
        placeHoverOverlay.setPosition(undefined);
        churchHoverOverlay.setPosition(undefined);
        if (nextHoveredFeature) {
          const marker = members[0];
          const isGroupOverlap = (marker.get("groupColors") ?? []).length > 1;
          const overlay = marker.get("kind") === "church" && !isGroupOverlap ? churchHoverOverlay : placeHoverOverlay;
          const label = marker.get("kind") === "church" && !isGroupOverlap ? churchHoverLabel : placeHoverLabel;
          if (overlay === placeHoverOverlay) overlay.setOffset([isGroupOverlap ? overlapLabelOffsetX : settings.place.labelOffsetX, 0]);
          label.textContent = marker.get("name");
          overlay.setPosition(marker.getGeometry().getCoordinates());
        }
        document.querySelector("#filter-map").style.cursor = feature ? "pointer" : "";
      });
      map.on("singleclick", (event) => {
        if (coordinateEditMode) return;
        const feature = map.forEachFeatureAtPixel(event.pixel, (candidate) => candidate);
        if (!feature) return;
        const members = feature.get("features") ?? [];
        if (members.length > 1) {
          const extent = ol.extent.createEmpty();
          members.forEach((member) => ol.extent.extend(extent, member.getGeometry().getExtent()));
          map.getView().fit(extent, { padding:[55,55,55,55], maxZoom:14, duration:250 });
          return;
        }
        const marker = members[0];
        if (marker) location.href = `../${marker.get("kind") === "church" ? "churches" : "places"}/${encodeURIComponent(marker.get("slug"))}/`;
      });
      map.getViewport().addEventListener("contextmenu", (event) => {
        if (coordinateEditMode) return;
        const feature = map.forEachFeatureAtPixel(map.getEventPixel(event), (candidate) => candidate);
        const members = feature?.get("features") ?? [];
        if (members.length !== 1) return;
        event.preventDefault();
        openMarkerPopup(members[0]);
      });
      map.once("postrender", () => {
        requestAnimationFrame(() => fitToVisibleFeatures(source.getFeatures().length));
      });
      filtersTabButton.addEventListener("click", () => showPanel("filters"));
      legendTabButton.addEventListener("click", () => showPanel("legend"));
      selectedPlacesTab.addEventListener("click", () => showSelectedObjectKind("place"));
      selectedChurchesTab.addEventListener("click", () => showSelectedObjectKind("church"));
      updateAdministrativeOptions();
      renderGroups();
      update();
    })();
  </script>
</body>
</html>
